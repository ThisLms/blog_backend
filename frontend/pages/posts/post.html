<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿 | MoonLog</title>
    <link rel="stylesheet" href="../../css/index.css">
    <link rel="stylesheet" href="../../css/pages/posts/post.css">
</head>

<body>
    <header id="header"></header>

    <div class="layout">
        <aside id="sidebar"></aside>

        <main class="post-write-page">
            <div class="post-write-heading">
                <h2>投稿</h2>
                <p>学んだことや開発の記録を残しましょう。</p>
            </div>

            <p id="post-write-auth-error" class="post-write-error" role="alert" hidden></p>

            <form id="post-write-form" novalidate hidden>
                <div id="post-write-edit-fields">
                    <div class="post-write-field">
                        <label for="post-write-title">タイトル</label>
                        <input id="post-write-title" name="title" type="text" maxlength="150"
                            placeholder="タイトルを入力してください" required>
                    </div>

                    <div class="post-write-field">
                        <label for="post-write-tags">タグ（任意）</label>
                        <input id="post-write-tags" name="tags" type="text" placeholder="FastAPI, JWT, MySQL"
                            autocomplete="off" aria-describedby="post-write-tags-help">
                        <small id="post-write-tags-help">
                            カンマで区切って入力してください。最大5個、各10文字まで。
                        </small>
                    </div>
                </div>

                <div class="post-write-tabs" role="tablist" aria-label="投稿編集モード">
                    <button type="button" id="post-write-edit-tab" role="tab" aria-selected="true"
                        aria-controls="post-write-edit-panel">編集</button>
                    <button type="button" id="post-write-preview-tab" role="tab" aria-selected="false"
                        aria-controls="post-write-preview-panel" tabindex="-1">プレビュー</button>
                </div>

                <section id="post-write-edit-panel" role="tabpanel" aria-labelledby="post-write-edit-tab">
                    <div class="post-write-editor-heading">
                        <label for="post-write-markdown">本文 (Markdown)</label>
                    </div>
                    <div class="post-write-editor-pane">
                        <textarea id="post-write-markdown" name="content" spellcheck="false"
                            placeholder="# タイトル&#10;&#10;内容を入力してください..." required></textarea>
                    </div>
                </section>

                <section id="post-write-preview-panel" role="tabpanel" aria-labelledby="post-write-preview-tab" hidden>
                    <article class="post-write-article-preview">
                        <div class="post-write-article-meta">
                            <span id="post-write-preview-tags"></span>
                        </div>
                        <header class="post-write-article-header">
                            <h1 id="post-write-preview-title"></h1>
                        </header>
                        <div id="post-write-preview" class="post-write-markdown-body"></div>
                    </article>
                    <p class="post-write-preview-note">これは公開前のプレビューです。投稿はまだ保存されていません。</p>
                </section>

                <p id="post-write-error" class="post-write-error" role="alert" hidden></p>

                <div class="post-write-actions">
                    <button type="button" id="location-home">ホームへ</button>
                    <button type="button" id="post-write-clear">初期化</button>
                    <button type="submit" id="post-write-submit">投稿</button>
                </div>
            </form>
        </main>
    </div>

    <footer id="footer"></footer>

    <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script defer src="../../js/components/components.js"></script>
    <script defer src="../../js/pages/api/certification.js"></script>
    <script defer src="../../js/pages/posts/post.js"></script>
</body>

</html>
