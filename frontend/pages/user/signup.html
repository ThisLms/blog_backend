<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録 - MoonLog</title>
    <link rel="stylesheet" href="../../css/index.css">
    <link rel="stylesheet" href="../../css/pages/user/signup.css">
</head>

<body>
    <header id="header"></header>

    <div class="layout">
        <aside id="sidebar"></aside>

        <main class="signup-page">
            <section class="signup-card" aria-labelledby="signup-title">
                <h2 id="signup-title">会員登録</h2>

                <form id="signup-form">
                    <div class="signup-field">
                        <label for="signup-login-id">ログインID</label>
                        <input id="signup-login-id" name="login_id" type="text" autocomplete="username" maxlength="20" required>
                    </div>

                    <div class="signup-field">
                        <label for="signup-user-name">表示名</label>
                        <input id="signup-user-name" name="user_name" type="text" autocomplete="nickname" maxlength="25"
                            required>
                    </div>

                    <div class="signup-field">
                        <label for="signup-email">メールアドレス</label>
                        <input id="signup-email" name="email" type="email" autocomplete="email" maxlength="255"
                            required>
                    </div>

                    <div class="signup-field">
                        <label for="signup-password">パスワード</label>
                        <input id="signup-password" name="password" type="password" autocomplete="new-password"
                            minlength="6" maxlength="15" aria-describedby="signup-password-hint" required>
                        <p id="signup-password-hint">6〜15文字で入力してください。</p>
                    </div>

                    <div class="signup-field">
                        <label for="signup-gender">性別（任意）</label>
                        <select id="signup-gender" name="gender">
                            <option value="" selected>未選択</option>
                            <option value="1">男性</option>
                            <option value="2">女性</option>
                        </select>
                    </div>

                    <div class="signup-field">
                        <label for="signup-birthday">生年月日（任意）</label>
                        <input id="signup-birthday" name="birthday" type="date" autocomplete="bday">
                    </div>

                    <div class="signup-field">
                        <label for="signup-introduction">自己紹介（任意）</label>
                        <textarea id="signup-introduction" name="introduction" rows="4"></textarea>
                    </div>
                    <div class="siginup-field">
                        <p id="siginup-error" role="alert" aria-live="polite" hidden></p>
                    </div>
                    <button type="submit">登録する</button>
                </form>

                <p class="signup-login-link">
                    アカウントをお持ちの方は <a href="./login.html">ログイン</a>
                </p>
            </section>
        </main>
    </div>

    <footer id="footer"></footer>
    <script src="../../js/components/components.js" defer></script>
    <script src="../../js/pages/user/siginup.js"></script>
</body>

</html>
